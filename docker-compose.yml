version: "3.8"

services:
  webtop:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: webtop
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta
    volumes:
      - ${HOME:-/home/agent}:/config/Desktop/HostHome
    ports:
      - "3000:3000"
    shm_size: "2gb"
    restart: unless-stopped
